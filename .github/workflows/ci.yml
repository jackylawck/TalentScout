name: TalentScout CI & Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint and Check Syntax
      run: |
        # 檢查 Python 腳本是否有語法錯誤或匯入缺失
        python -m py_compile app.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Run Bandit Security Scan
      run: |
        pip install bandit
        # 靜態掃描程式碼中的潛在資安漏洞（如硬碼金鑰、不安全函式）
        bandit -r app.py -ll
